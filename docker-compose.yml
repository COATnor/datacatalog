volumes:
  ckan_storage:
    driver: local
  solr_data:
    driver: local
  pg_data:
    driver: local
  tokens:
    driver: local
  pycsw_data:
    driver: local

x-pycsw-env:
  &pycsw-env
  DATABASE: sqlite:////home/pycsw/cite.db

x-coat-env:
  &coat-env
  COAT_URL: http://ckan:5000/

x-common-ckan-env:
  &common-ckan-env
  # Defaults work with linked containers, change to use own Postgres, SolR, Redis or Datapusher
  CKAN_SITE_URL: ${CKAN_SITE_URL}
  CKAN_SQLALCHEMY_URL: postgresql://ckan:${POSTGRES_PASSWORD}@db/ckan
  CKAN_SOLR_URL: http://solr:8983/solr/ckan
  CKAN_REDIS_URL: redis://redis:6379/1
  CKAN_MAX_UPLOAD_SIZE_MB: ${CKAN_MAX_UPLOAD_SIZE_MB}
  BEAKER_SESSION_SECRET: ${BEAKER_SESSION_SECRET}
  POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
  # OAuth2 / Feide
  CKAN_OAUTH2_AUTHORIZATION_ENDPOINT: ${CKAN_OAUTH2_AUTHORIZATION_ENDPOINT}
  CKAN_OAUTH2_TOKEN_ENDPOINT: ${CKAN_OAUTH2_TOKEN_ENDPOINT}
  CKAN_OAUTH2_CLIENT_ID: ${CKAN_OAUTH2_CLIENT_ID}
  CKAN_OAUTH2_CLIENT_SECRET: ${CKAN_OAUTH2_CLIENT_SECRET}
  # Sentry
  SENTRY_DSN: ${SENTRY_DSN:-}
  # DOI
  DOI_PREFIX: ${DOI_PREFIX}
  DOI_ACCOUNT_NAME: ${DOI_ACCOUNT_NAME}
  DOI_ACCOUNT_PWD: ${DOI_ACCOUNT_PWD}
  # Misc
  USERSPEC: ckan

x-common-ckan:
  &common-ckan
  build: .
  hostname: ckan
  networks:
    default:
      aliases:
        - ckan
  depends_on:
    db:
      condition: service_healthy
    solr:
      condition: service_healthy
    redis:
      condition: service_healthy
    pycsw:
      condition: service_started
    bulk-download:
      condition: service_started
    traefik:
      condition: service_started
  volumes:
    - &common-ckan-volume
      ckan_storage:/var/lib/ckan
  healthcheck:
    test: ["CMD", "wget", "-qO", "/dev/null", "localhost:5000/dataset/"]
  labels:
    - traefik.enable=true
    - traefik.http.routers.ckan.rule=PathPrefix(`/`)
    - traefik.http.routers.ckan.priority=1
    - traefik.http.services.ckan.loadbalancer.server.port=5000

x-common-ckan-prod:
  &common-ckan-prod
  << : *common-ckan
  environment:
    << : *common-ckan-env
    DOI_TEST_MODE: false

x-common-ckan-dev:
  &common-ckan-dev
  << : *common-ckan
  volumes:
    - *common-ckan-volume
    - ./ckanext/ckanext-coat/ckanext:/usr/lib/ckan/ckanext/ckanext-coat/ckanext:ro
    - ./ckanext/ckanext-coatcustom/ckanext:/usr/lib/ckan/ckanext/ckanext-coatcustom/ckanext:ro
    - ./ckanext/ckanext-datasetversions/ckanext:/usr/lib/ckan/ckanext/ckanext-datasetversions/ckanext:ro
    - ./ckanext/ckanext-oauth2/ckanext:/usr/lib/ckan/ckanext/ckanext-oauth2/ckanext:ro
    - ./custom/coat-entrypoint.sh:/coat-entrypoint.sh:ro
    - ./custom/coat-entrypoint-dev.sh:/coat-entrypoint-dev.sh:ro
    - tokens:/tokens
  entrypoint: ["bash", "/coat-entrypoint-dev.sh"]
  environment:
    &common-ckan-env-dev
    << : *common-ckan-env
    DOI_TEST_MODE: true
    OAUTHLIB_INSECURE_TRANSPORT: 1
    CKAN_ADMIN_PASSWORD: ${CKAN_ADMIN_PASSWORD:-}

services:
  ckan-prod:
    << : *common-ckan-prod
    profiles:
      - prod

  ckan-dev:
    << : *common-ckan-dev
    profiles:
      - dev
    command: 'python -m pdb -c continue /usr/lib/ckan/.venv/bin/ckan run --host 0.0.0.0 --passthrough-errors'
    tty: true
    stdin_open: true
    environment:
      << : *common-ckan-env-dev
      WERKZEUG_DEBUG_PIN: 5000
      GUNICORN_CMD_ARGS: "--workers 4 --worker-class sync --timeout 60"

  ckan-test:
    << : *common-ckan
    profiles:
      - test
    volumes:
      - tokens:/tokens
    entrypoint: ["bash", "/coat-entrypoint-dev.sh"]
    command: ["gunicorn", "wsgi:application", "-b", "0.0.0.0:5000"]
    environment:
      << : *common-ckan-env-dev
      CKAN_SITE_URL: http://traefik
      GUNICORN_CMD_ARGS: "--workers 4 --worker-class sync --timeout 60"

  lightpanda:
    image: lightpanda/browser:nightly
    profiles:
      - test

  test:
    profiles:
      - test
    build:
      context: .
      target: test
    depends_on:
      ckan-test:
        condition: service_healthy
      lightpanda:
        condition: service_started
    environment:
      COAT_URL: http://traefik
      CDP_ENDPOINT: ws://lightpanda:9222
    volumes:
      - ./tests/latest_logs:/usr/lib/ckan/tests/latest_logs
      - tokens:/tokens:ro

  pycsw:
    image: geopython/pycsw:3.0.0-beta3
    environment:
      << : *pycsw-env
      PYCSW_CONFIG: /etc/pycsw.yml
      PYCSW_URL: ${CKAN_SITE_URL}/pycsw
    healthcheck:
      test: ["CMD", "/venv/bin/python3", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/')"]
    labels:
      - traefik.enable=true
      - traefik.http.routers.pycsw.rule=PathPrefix(`/pycsw`)
      - traefik.http.middlewares.pycsw-strip.stripprefix.prefixes=/pycsw
      - traefik.http.routers.pycsw.middlewares=pycsw-strip
      - traefik.http.services.pycsw.loadbalancer.server.port=8000
    volumes:
      - pycsw_data:/home/pycsw
      - ./services/pycsw-server/pycsw.yml:/etc/pycsw.yml:ro

  coat2pycsw:
    build: services/pycsw
    image: ghcr.io/coatnor/coat2pycsw:main
    environment:
      << : [*coat-env, *pycsw-env]
    volumes:
      - pycsw_data:/home/pycsw

  bulk-download:
    build: services/bulk-download
    image: ghcr.io/coatnor/coat-bulk-download:main
    environment:
      << : *coat-env
      COAT_PUBLIC_URL: http://127.0.0.1:${CKAN_PORT}/
    labels:
      - traefik.enable=true
      - traefik.http.routers.bulk-download.rule=PathRegexp(`^/dataset/[^/]+/(zip|geojson)$`)
      - traefik.http.services.bulk-download.loadbalancer.server.port=8000

  traefik:
    image: traefik:v3.6
    command:
      - --providers.docker=true
      - --providers.docker.exposedbydefault=false
      - --entrypoints.web.address=:80
      - --entrypoints.web.transport.respondingTimeouts.readTimeout=0
      - --api.insecure=true
      - --accesslog=true
    ports:
      - "${CKAN_PORT}:80"
      - "8080:8080"
    volumes:
      - ${DOCKER_SOCK:-/var/run/docker.sock}:/var/run/docker.sock:ro

  db:
    image: postgres:18
    environment:
      POSTGRES_DB: ckan
      POSTGRES_USER: ckan
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
    volumes:
      - pg_data:/var/lib/postgresql
    healthcheck:
      test: ["CMD", "pg_isready", "-U", "ckan"]

  solr-init:
    image: busybox
    user: root
    volumes:
      - solr_data:/var/solr/data
    command: ["chown", "-R", "8983:8983", "/var/solr/data"]

  solr:
    build: services/solr
    image: ghcr.io/coatnor/datacatalog/solr:main
    depends_on:
      solr-init:
        condition: service_completed_successfully
    volumes:
      - solr_data:/var/solr/data
    labels:
      - traefik.enable=true
      - traefik.http.routers.solr.rule=PathPrefix(`/solr`)
      - traefik.http.services.solr.loadbalancer.server.port=8983
    healthcheck:
      test: ["CMD", "wget", "-qO", "/dev/null", "localhost:8983/solr/ckan/admin/ping"]
      start_period: 5s
      interval: 5s
      retries: 10

  redis:
    image: redis:6
    healthcheck:
      test: ["CMD", "redis-cli", "-e", "QUIT"]
