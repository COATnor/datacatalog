server:
  url: ${PYCSW_URL}
  mimetype: application/xml; charset=UTF-8
  encoding: UTF-8
  language: en-US
  maxrecords: 10
  gzip_compresslevel: 9

profiles:
  - apiso

logging:
  level: WARNING

manager:
  transactions: false
  allowed_ips:
    - 127.0.0.1

metadata:
  identification:
    title: COAT Geospatial Catalogue
    description: COAT OGC CSW server powered by pycsw
    keywords:
      - coat
      - catalogue
      - discovery
      - metadata
    fees: None
    accessconstraints: None
  provider:
    name: COAT
    url: https://coat.no/
  contact:
    name: Francesco Frassinelli
    country: Norway
    url: https://www.nina.no/english/Contact/Employees/Employee-info?AnsattID=15958
    role: pointOfContact
  inspire:
    enabled: false
    languages_supported:
      - eng
    default_language: eng
    date: "2026-08-04"
    gemet_keywords:
      - Utility and governmental services
    conformity_service: notEvaluated
    contact_name: COAT
    contact_email: data@coat.no
    temp_extent:
      begin: 2000-01-01
      end: 2026-12-31

repository:
  database: ${DATABASE}
  table: records
